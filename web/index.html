<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OrderVista">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="OrderVista" />
  <meta property="og:description" content="City University of Hong Kong • Abed Al Rahman" />
  <meta property="og:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" /> 
  <meta name="twitter:title" content="OrderVista" />
  <meta name="twitter:description" content="City University of Hong Kong • Abed Al Rahman" />
  <meta name="twitter:image" content="https://storage.googleapis.com/flutterflow-prod-hosting/og_splash_gradient.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> OrderVista </title>
  <meta name="description" content="City University of Hong Kong • Abed Al Rahman" />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">

  <!-- Drift web (sql.js) support: load from CDN with explicit wasm URL and MIME-safe hint -->
  <script>
    var Module = Module || {};
    const wasmCdnBase = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.9.0/";
    const wasmUrl = wasmCdnBase + "sql-wasm.wasm?v=3";
    // Ensure sql.js requests the wasm from CDN (not localhost) and uses correct URL.
    Module.locateFile = Module.locateFile || function(path) {
      return wasmCdnBase + path + "?v=3";
    };
    Module.wasmBinaryFile = wasmUrl;
    window.sqliteWasmUrl = wasmUrl;
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.9.0/sql-wasm.js?v=3" crossorigin="anonymous"></script>
  
</head>
<body>
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
